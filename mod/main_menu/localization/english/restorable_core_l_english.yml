l_english:
 KOJ: "Jerusalem"
 KOJ_ADJ: "Jerusalemite"
 KOJ_ADJ2: "Jerusalemite"
 restoration_crusader_state: "Crusader State"
 restoration_crusader_state_desc: "A crusader crown under papal protection. It keeps its own monarch and diplomacy, owes no gold, manpower, or sailor tribute to Rome, and cannot be diplomatically annexed. The overlord protects it from external attacks; both partners join defensive wars. Crusader States have a reduced combined-strength penalty to loyalty. The Papal Covenant grants +25 Loyalty to Overlord while this Crusader State relationship exists; ending or replacing the relationship removes the loyalty bonus. Crusader State Fort Support grants +25% Fort Defense, +20% Garrison Size and +25% Fortification Maintenance Efficiency (reduced upkeep) to ALL fort locations owned by the subject, including future forts. These benefits last only while this Crusader State relationship exists and end when it is ended or replaced. Catholic Jerusalem also receives escalating crusader volunteers during a defensive war against a more populous enemy. Future arrivals stop when that war or this relationship ends; troops already received remain."
 restoration_knights_of_the_sepulchre: "Knights of the Holy Sepulchre"
 restoration_knights_of_the_sepulchre_desc: "The restored crown gathers veteran pilgrims, exiled brothers and younger sons beneath the Jerusalem cross. Their oath binds the lance to the protection of the pilgrim road."
 restoration_assizes_of_jerusalem: "The Restored Assizes"
 restoration_assizes_of_jerusalem_desc: "The restored crown renews the laws of the old kingdom with a charter protecting the worship and customary courts of the kingdom's Jewish and Arab communities."
 restoration_hospices_of_the_pilgrim_road: "Hospices of the Pilgrim Road"
 restoration_hospices_of_the_pilgrim_road_desc: "A chain of hospices between Acre and Jerusalem shelters travellers and tends wounded soldiers, binding the crown to its people."
 restoration_charter_of_acre: "The Charter of Acre"
 restoration_charter_of_acre_desc: "Trading privileges draw Italian merchants back to Acre, while the king's harbour galleys keep the sea road to Christendom open."
 restoration_brothers_of_the_watch: "Brothers of the Watch"
 restoration_brothers_of_the_watch_desc: "The orders rotate seasoned captains through the frontier castles, turning scattered garrisons into a disciplined brotherhood."
 restoration_crusader_knights: "Crusader Knights"
 restoration_crusader_knights_desc: "Heavy cavalry sworn to the restored kingdom, equipped for the decisive charge and protected by the rule of the brotherhood."
 LEAD_restoration_crusader_state: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_restoration_crusader_state: "[SUBJECT_TYPE.GetName] of $LIST$."
 restoration_volunteers.1.title: "The Pope’s Call to Defend the Holy Land"
 restoration_volunteers.1.desc: "The Holy Father has called upon the faithful to defend Jerusalem. Across Christendom, bishops gather donations, nobles muster their retinues, and knights take vows to protect the Holy Land.\n\nThe Papal States have now sent the first host of knights and fighting men to our shores. They arrive beneath the cross, ready to stand beside us against the invader."
 restoration_volunteers.2.title: "The Holy Orders Take Up the Watch"
 restoration_volunteers.2.desc: "The Pope’s appeal has stirred the great military orders. Their commanders have pledged to sustain the defence of the Holy Land, gathering brothers, household troops, and armed pilgrims from across Christendom.\n\nA fresh contingent has arrived in Jerusalem. What began as a Papal summons is becoming an enduring commitment."
 restoration_volunteers.3.title: "Reinforcements from the Holy Orders"
 restoration_volunteers.3.desc: "The war continues, but the holy orders have kept their pledge. Their houses throughout Christendom gather recruits, supplies, and donations for the defence of Jerusalem.\n\nAnother host of knights and infantry has reached the Holy Land, ready to relieve the weary and take its place beneath the cross."
 restoration_volunteers.welcome: "Welcome our brothers beneath the cross."
 restoration_volunteers.1.arrival: "1,000 infantry and 200 Crusader Knights have arrived. Normal army upkeep applies."
 restoration_volunteers.2.arrival: "2,000 infantry and 600 Crusader Knights have arrived. Normal army upkeep applies."
 restoration_volunteers.3.arrival: "3,000 infantry and 1,000 Crusader Knights have arrived. Normal army upkeep applies."
 CTP: "Tripoli"
 CAN: "Antioch"
 CAN_ADJ: "Antiochene"
 CAN_ADJ2: "Antiochene"
 restoration_antioch_orontes_lances: "Lances of the Orontes"
 restoration_antioch_orontes_lances_desc: "The prince gathers mounted brothers to guard the Orontes crossings and the northern approaches to the Holy Land."
 restoration_antioch_compact_of_the_churches: "Compact of the Churches"
 restoration_antioch_compact_of_the_churches_desc: "A Catholic crown rules a land of ancient churches and many tongues. The prince protects local rites and welcomes regional communities into the restoration."
 restoration_antioch_frontier_castles: "Castles of the Northern March"
 restoration_antioch_frontier_castles_desc: "Experienced castellans share their frontier lessons throughout the principality, strengthening the defence of every Antiochene fort."
 CTP_ADJ: "Tripolitan"
 CTP_ADJ2: "Tripolitan"
 restoration_tripoli_harbour_charters: "Charters of the Levantine Ports"
 restoration_tripoli_harbour_charters_desc: "The count grants merchant houses a common charter linking Tripoli, Beirut and Sidon, strengthening the county’s maritime trade."
 restoration_tripoli_coastal_brotherhood: "The Coastal Brotherhood"
 restoration_tripoli_coastal_brotherhood_desc: "Mounted brothers guard the roads between the ports while galley crews protect the sea road to Jerusalem."
 restoration_tripoli_arsenals: "The Arsenals of Tripoli"
 restoration_tripoli_arsenals_desc: "Shared stores, skilled shipwrights and permanent dockyard contracts reduce the cost of maintaining the county’s galley fleet."
